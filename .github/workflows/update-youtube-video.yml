name: Update Latest YouTube Video

on:
  schedule:
    # Hourly. The channel posts about weekly, so this is still far more often
    # than needed — and polling harder gets us rate-limited by YouTube, which
    # is what makes the RSS fetch fail.
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual triggering for testing

permissions:
  contents: write

jobs:
  update-video:
    runs-on: ubuntu-latest

    # Skip if the last commit was from the bot to prevent loops
    if: github.event.head_commit.author.name != 'bush-chapel-bot'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest video from RSS feed
        id: fetch_video
        run: |
          # Hardcoded channel ID for @Thebushchapel
          CHANNEL_ID="UC4LfSjlnX99HNzV3e87xpjA"
          RSS_URL="https://www.youtube.com/feeds/videos.xml?channel_id=$CHANNEL_ID"

          # Fetch RSS feed with retries
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RSS_CONTENT=$(curl -sSL --max-time 30 \
              -H "User-Agent: Mozilla/5.0 (compatible; BushChapelBot/1.0)" \
              "$RSS_URL" 2>/dev/null || echo "")

            # Verify we got actual RSS XML, not an HTML error/consent page
            if echo "$RSS_CONTENT" | grep -q '<yt:videoId>'; then
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES (response was empty or not valid RSS)..."
            sleep $((RETRY_COUNT * 3))
          done

          if ! echo "$RSS_CONTENT" | grep -q '<yt:videoId>'; then
            echo "YouTube RSS temporarily unavailable — will retry next run"
            # NOTE: this exit only ends *this step*, not the job. Downstream steps
            # are gated on rss_ok so they cannot run with an empty video_id.
            echo "rss_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "rss_ok=true" >> $GITHUB_OUTPUT

          # Save the feed so later steps reuse it instead of re-fetching
          printf '%s' "$RSS_CONTENT" > /tmp/rss_feed.xml

          # Extract latest video ID from XML
          LATEST_VIDEO_ID=$(echo "$RSS_CONTENT" | grep -oP '<yt:videoId>\K[^<]+' | head -n 1)

          if [ -z "$LATEST_VIDEO_ID" ]; then
            echo "Error: Failed to extract video ID from RSS feed"
            exit 1
          fi

          # Validate video ID format (11 chars, alphanumeric + - and _)
          if ! echo "$LATEST_VIDEO_ID" | grep -qE '^[A-Za-z0-9_-]{11}$'; then
            echo "Error: Invalid video ID format: $LATEST_VIDEO_ID"
            exit 1
          fi

          echo "video_id=$LATEST_VIDEO_ID" >> $GITHUB_OUTPUT
          echo "Latest video ID: $LATEST_VIDEO_ID"

          # Extract video title for commit message
          VIDEO_TITLE=$(echo "$RSS_CONTENT" | grep -oP '<title>\K[^<]+' | sed -n '2p' | sed 's/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g; s/&#39;/'\''/g')

          echo "video_title=$VIDEO_TITLE" >> $GITHUB_OUTPUT
          echo "Video title: $VIDEO_TITLE"

      - name: Check current video ID
        id: check_current
        if: steps.fetch_video.outputs.rss_ok == 'true'
        run: |
          CURRENT_VIDEO_ID=$(grep -oP 'youtube\.com/embed/\K[^"]+' index.html | head -n 1)
          echo "current_id=$CURRENT_VIDEO_ID" >> $GITHUB_OUTPUT
          echo "Current video ID: $CURRENT_VIDEO_ID"

      - name: Update video embed
        id: update_embed
        if: steps.fetch_video.outputs.rss_ok == 'true'
        run: |
          CURRENT_ID="${{ steps.check_current.outputs.current_id }}"
          LATEST_ID="${{ steps.fetch_video.outputs.video_id }}"

          # Never write an empty or malformed ID into the embed
          if ! echo "$LATEST_ID" | grep -qE '^[A-Za-z0-9_-]{11}$'; then
            echo "Error: refusing to write invalid video ID: '$LATEST_ID'"
            exit 1
          fi

          VIDEO_CHANGED=false

          # Check if video needs updating
          if [ "$CURRENT_ID" != "$LATEST_ID" ]; then
            echo "Updating video from '$CURRENT_ID' to '$LATEST_ID'"
            # Match the whole ID slot ([^"]*) so this also repairs a blanked embed
            sed -i "s|youtube\.com/embed/[^\"]*|youtube.com/embed/${LATEST_ID}|g" index.html

            NEW_ID=$(grep -oP 'youtube\.com/embed/\K[^"]+' index.html | head -n 1)
            if [ "$NEW_ID" != "$LATEST_ID" ]; then
              echo "Error: Failed to update video ID (got '$NEW_ID')"
              exit 1
            fi
            VIDEO_CHANGED=true
          fi

          if [ "$VIDEO_CHANGED" = "true" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "video_changed=$VIDEO_CHANGED" >> $GITHUB_OUTPUT
          else
            echo "No updates needed"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Update video archive
        id: update_archive
        if: steps.fetch_video.outputs.rss_ok == 'true'
        run: |
          # Reuses the feed saved by the fetch step — no second request
          if ! grep -q '<yt:videoId>' /tmp/rss_feed.xml 2>/dev/null; then
            echo "No valid RSS available for archive update"
            echo "archive_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          python3 << 'PYEOF'
          import json, re

          # Read RSS feed from temp file
          with open('/tmp/rss_feed.xml', 'r') as f:
              rss = f.read()

          # Parse video entries from RSS
          entries = re.findall(
              r'<yt:videoId>([^<]+)</yt:videoId>.*?<title>([^<]+)</title>.*?<published>([^<]+)</published>',
              rss, re.DOTALL
          )

          # Load existing archive
          try:
              with open('videos.json', 'r') as f:
                  archive = json.load(f)
          except:
              archive = {'lastUpdated': '', 'videos': []}


          def word(tl, *words):
              """Whole-word test. Substring matching misfiles titles: 'passion'
              hits 'compassion', 'lent' hits 'excellent'."""
              return any(re.search(r'\b' + w + r'\b', tl) for w in words)


          def detect_season(title):
              tl = title.lower()
              # Palm Sunday and Ascension name no season word of their own
              if word(tl, 'palm sunday'):
                  return 'lent'
              if word(tl, 'ascension'):
                  return 'easter'
              if word(tl, 'lent', 'lenten', 'passion sunday'):
                  return 'lent'
              if word(tl, 'advent'):
                  return 'advent'
              if word(tl, 'christmas'):
                  return 'christmas'
              if word(tl, 'easter'):
                  return 'easter'
              if word(tl, 'pentecost'):
                  return 'pentecost'
              return 'ordinary-time'


          def is_service(title):
              """Newsletters and notices are not services. A 'Newsletter week'
              post that names a lectionary Proper is a service, so keep it."""
              tl = title.lower().strip()
              if 'a note and lovely quote' in tl:
                  return False
              if re.match(r'^(the bush chapel[\s:-]*)?\d{4}$', tl):
                  return False
              if tl.startswith('newsletter') and 'proper' not in tl:
                  return False
              return True


          def clean_title(title):
              t = title.strip()
              for prefix in ['The Bush Chapel - ', 'The Bush Chapel -  ', 'The Bush Chapel -',
                             'The Bush Chapel: ', 'The Bush chapel: ', 'The Bush chapel - ',
                             'Bush Chapel: ', 'Bush chapel: ']:
                  if t.startswith(prefix):
                      t = t[len(prefix):]
                      break
              return t.rstrip('.').strip()


          existing_ids = {v['id'] for v in archive['videos']}
          feed_ids = [e[0] for e in entries]
          new_videos = []

          for vid_id, title, pub_date in entries:
              if vid_id in existing_ids:
                  continue
              if not is_service(title):
                  print(f"Skipping non-service: {title}")
                  continue

              date = pub_date[:10]
              new_videos.append({
                  'id': vid_id,
                  'title': clean_title(title),
                  'published': date,
                  'season': detect_season(title),
                  'year': int(date[:4])
              })

          # Gap detection. The RSS feed only carries the latest 15 uploads, so if
          # NONE of them are already archived the workflow has been down long
          # enough that older videos have fallen out of the window and can never
          # be ingested. Backfilling those needs the uploads playlist, not RSS.
          if feed_ids and not (set(feed_ids) & existing_ids) and archive['videos']:
              print("::warning::None of the latest %d uploads were in the archive — "
                    "videos may have fallen out of the RSS window and need a manual "
                    "backfill from the uploads playlist." % len(feed_ids))

          if new_videos:
              # Merge and sort by date rather than blind-prepending, so a video
              # ingested out of order still lands in the right place.
              archive['videos'] = sorted(
                  new_videos + archive['videos'],
                  key=lambda v: v['published'], reverse=True
              )
              archive['lastUpdated'] = archive['videos'][0]['published']

              with open('videos.json', 'w') as f:
                  json.dump(archive, f, indent=2)

              print(f"Added {len(new_videos)} new video(s) to archive")
              with open('/tmp/archive_changed', 'w') as f:
                  f.write('true')
          else:
              print("No new videos for archive")
              with open('/tmp/archive_changed', 'w') as f:
                  f.write('false')
          PYEOF

          ARCHIVE_CHANGED=$(cat /tmp/archive_changed 2>/dev/null || echo "false")
          echo "archive_changed=$ARCHIVE_CHANGED" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.update_embed.outputs.updated == 'true' || steps.update_archive.outputs.archive_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_TITLE: ${{ steps.fetch_video.outputs.video_title }}
          VIDEO_CHANGED: ${{ steps.update_embed.outputs.video_changed }}
          ARCHIVE_CHANGED: ${{ steps.update_archive.outputs.archive_changed }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "bush-chapel-bot"

          git add index.html videos.json

          # Build commit message based on what changed
          PARTS=""
          if [ "$VIDEO_CHANGED" = "true" ]; then
            PARTS="video: $VIDEO_TITLE"
          fi
          if [ "$ARCHIVE_CHANGED" = "true" ]; then
            [ -n "$PARTS" ] && PARTS="$PARTS, "
            PARTS="${PARTS}archive"
          fi

          COMMIT_MSG="[skip ci] Update $PARTS"

          git commit -m "$COMMIT_MSG"
          git push

      - name: Summary
        if: always()
        env:
          UPDATED: ${{ steps.update_embed.outputs.updated }}
          VIDEO_CHANGED: ${{ steps.update_embed.outputs.video_changed }}
          VIDEO_TITLE: ${{ steps.fetch_video.outputs.video_title }}
        run: |
          if [ "$UPDATED" = "true" ]; then
            echo "Updates applied:"
            if [ "$VIDEO_CHANGED" = "true" ]; then
              echo "  - Video: $VIDEO_TITLE"
            fi
          else
            echo "No updates needed - everything is current"
          fi
